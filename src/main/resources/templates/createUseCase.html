<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8">
    <title>Create Use Case</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            background-image: url('/images/project_details.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* DARK OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #020617;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar h2 {
            text-align: center;
            color: lawngreen;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #00ffcc;
            color: black;
        }

        /* MAIN */
        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .title {
            font-size: 28px;
            color: lawngreen;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* CARD */
        .card {
            background: #020617;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,255,204,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: orangered;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: limegreen;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.05);
            background: limegreen;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 15px;
            background: red;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-back:hover {
            transform: scale(1.05);
            background: red;
        }

        .label {
            color: limegreen;
            font-weight: bold;
        }

        .bullet-box {
            width: 100%;
            max-width: 500px;
            min-height: 120px;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: none;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            outline: none;
            line-height: 1.6;
        }

        .bullet-box:focus {
            box-shadow: 0 0 8px rgba(0,255,204,0.5);
        }

        input[type="text"] {
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a th:href="@{/projects/{id}(id=${project.id})}">📁 Project Details</a>
</div>

<!-- MAIN -->
<div class="main">
    <div class="title">Create Use Case for Project: <span th:text="${project.name}"></span></div>

    <!-- ONLY CREATE FORM -->
    <div class="card">
        <h3>Create New Use Case</h3>
        <form th:action="@{/usecases/create}" method="post">
            <input type="hidden" name="projectId" th:value="${project.id}" />

            <label class="label">Name:
                <input type="text" name="name" required/>
            </label><br/>

            <label class="label">Actors:
                <input type="text" name="actors" required/>
            </label><br/>

            <label class="label">Preconditions:
                <label class="label">Preconditions:</label><br/>
                <textarea id="preconditions" name="preconditions" class="bullet-box"></textarea><br/>
            </label><br/>

            <label class="label">Main Flow:
                <label class="label">Main Flow:</label><br/>
                <textarea id="mainFlow" name="mainFlow" class="bullet-box"></textarea><br/>
            </label><br/>

            <label class="label">Postconditions:
                <label class="label">Postconditions:</label><br/>
                <textarea id="postconditions" name="postconditions" class="bullet-box"></textarea><br/>
            </label><br/>

            <button class="btn" type="submit">Create Use Case</button>
        </form>

        <form th:action="@{/projects/{id}(id=${project.id})}" method="get">
            <button class="btn-back" type="submit">Back</button>
        </form>
    </div>

</div>

<script>
    function enableBulletBehavior(textareaId) {
        const textarea = document.getElementById(textareaId);

        // Βάζει το πρώτο bullet όταν ανοίγει η φόρμα
        textarea.addEventListener('focus', function () {
            if (textarea.value.trim() === '') {
                textarea.value = '• ';
            }
        });

        textarea.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();

                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const value = textarea.value;

                const newValue = value.substring(0, start) + '\n• ' + value.substring(end);
                textarea.value = newValue;

                textarea.selectionStart = textarea.selectionEnd = start + 3;
            }
        });
    }

    enableBulletBehavior('preconditions');
    enableBulletBehavior('mainFlow');
    enableBulletBehavior('postconditions');
</script>

</body>
</html>
