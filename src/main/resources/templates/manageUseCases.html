<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8">
    <title>Create Use Case</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            background-image: url('/images/project_details.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #020617;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar h2 {
            text-align: center;
            color: lawngreen;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #00ffcc;
            color: black;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .title {
            font-size: 28px;
            color: lawngreen;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background: #020617;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,255,204,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: orangered;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: limegreen;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.05);
            background: limegreen;
        }

        .label {
            color: limegreen;
            font-weight: bold;
        }

        .btn-delete {
            display: inline-block;
            padding: 10px 15px;
            background: red;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-cancel {
            display: inline-block;
            padding: 10px 15px;
            background: red;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            transform: scale(1.05);
            background: red;
        }

        #updateForm label {
            display: block;
            margin-top: 10px;
        }

        #updateForm input[type="text"] {
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

    </style>
</head>

<body>

<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a th:href="@{/projects/{id}(id=${project.id})}">📁 Project Details</a>
</div>

<div class="main">

    <div class="title">Manage the existing Use Cases for: <span th:text="${project.name}"></span></div>

    <!-- EXISTING USE CASES -->
    <div class="card">
        <div th:if="${#lists.isEmpty(usecases)}">No use cases yet.</div>

        <div th:each="uc, iterStat : ${usecases}">

            <h3 style="color: orangered;">
                Use Case <span th:text="${iterStat.count}"></span>
            </h3>

            <p>
                <span class="label">Name:</span> <span th:text="${uc.name}"></span><br/>
                <span class="label">Actors:</span> <span th:text="${uc.actors}"></span><br/>
                <span class="label">Preconditions:</span> <span th:text="${uc.preconditions}"></span><br/>
                <span class="label">Main Flow:</span> <span th:text="${uc.mainFlow}"></span><br/>
                <span class="label">Postconditions:</span> <span th:text="${uc.postconditions}"></span>
            </p>

            <form th:action="@{/usecases/delete}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${uc.id}" />
                <button class="btn-delete" type="submit">Delete</button>
            </form>

            <button class="btn"
                    th:attr="data-id=${uc.id}, data-name=${uc.name}, data-actors=${uc.actors}, data-index=${iterStat.count}"
                    onclick="showUpdateForm(this)">
                Update
            </button>

            <hr/>
        </div>
    </div>

    <!-- UPDATE FORM ONLY -->
    <div id="updateForm" class="card" style="display:none;">
        <h3>
            Updating Use Case:
            <span id="updateTitle"></span>
        </h3>

        <form th:action="@{/usecases/update}" method="post">
            <input type="hidden" name="id" id="updateId"/>

            <label class="label">Name:
                <input type="text" name="name" id="updateName"/>
            </label>

            <label class="label">Actors:
                <input type="text" name="actors" id="updateActors"/>
            </label>

            <button type="button" class="btn-cancel" onclick="hideUpdateForm()">Cancel</button>

            <button class="btn">Update</button>
        </form>
    </div>

</div>

<script>
    function showUpdateForm(button) {
        document.getElementById('updateForm').style.display = 'block';
        document.getElementById('updateId').value = button.dataset.id;
        document.getElementById('updateName').value = '';
        document.getElementById('updateActors').value = '';
        document.getElementById('updateTitle').innerText = button.dataset.index;
    }

    function hideUpdateForm() {
        document.getElementById('updateForm').style.display = 'none';
        document.getElementById('updateId').value = '';
        document.getElementById('updateName').value = '';
        document.getElementById('updateActors').value = '';
    }
</script>

</body>
</html>
