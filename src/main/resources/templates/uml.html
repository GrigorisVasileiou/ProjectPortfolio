<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>UML Script Viewer</title>
</head>

<body>

<style>
    body {
        margin: 0;
        font-family: Arial;
        color: white;

        background-image: url('/images/uml.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: -1;
    }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 220px;
        height: 100%;
        background: #020617;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .sidebar h2 {
        text-align: center;
        color: lawngreen;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        padding: 15px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background: #00ffcc;
        color: black;
    }

    .main {
        margin-left: 220px;
        padding: 30px;
    }

    .title {
        font-size: 28px;
        color: lawngreen;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        width: 250px;
        margin: 10px auto;
        font-size: 16px;
        padding: 14px;
        background: limegreen;
        color: black;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
        transition: 0.2s;
    }

    .btn:hover {
        transform: scale(1.05);
        background: limegreen;
    }

    .label {
        color: limegreen;
        font-weight: bold;
    }

</style>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a th:href="@{/projects/{id}(id=${projectId})}">📁 Project Details</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="title">UML Visualization</div>

<!-- Project ID -->
<input type="hidden" id="projectId" th:value="${projectId}">

<br><br>

<!-- BUTTONS -->
    <div class="card" style="text-align:center;">

        <button class="btn" onclick="loadUseCase()">
            📈 Show Use Case Script
        </button>

        <button class="btn" onclick="loadCRC()">
            📈 Show CRC Script
        </button>
    </div>

<!-- SCRIPT OUTPUT -->
    <div class="card" id="scriptCard" style="display:none;">
        <div class="label">PlantUML Script</div>
        <pre id="script" style="
        background:#0f172a;
        padding:15px;
        border-radius:8px;
        white-space:pre-wrap;
        color:white;
        line-height:1.6;
        margin-top:10px;
    "></pre>
    </div>

<script>
    /*
        LOAD USE CASE SCRIPT
    */
    async function loadUseCase() {

        const projectId = document.getElementById("projectId").value;

        console.log("Loading Use Case script for:", projectId);

        const res = await fetch(`/api/diagram/usecases/${projectId}`);
        const text = await res.text();

        console.log("Use Case Script:", text);

        document.getElementById("scriptCard").style.display = "block";
        document.getElementById("script").innerText = text;
    }

    /*
        LOAD CRC SCRIPT
    */
    async function loadCRC() {

        const projectId = document.getElementById("projectId").value;

        console.log("Loading CRC script for:", projectId);

        const res = await fetch(`/api/diagram/crc/${projectId}`);
        const text = await res.text();

        console.log("CRC Script:", text);

        document.getElementById("scriptCard").style.display = "block";
        document.getElementById("script").innerText = text;
    }
</script>

</div> <!-- close main -->

</body>
</html>
