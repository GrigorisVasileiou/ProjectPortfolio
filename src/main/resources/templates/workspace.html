<!DOCTYPE html>
</html>
<body>
<style>
    body{
        background-image:url('/images/workspace.png');
        background-size:cover;
        background-position: center 60%;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family:Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .top-text {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        transform: none;
        background: none;
        color: #00ff00;
        padding: 0;
        border-radius: 0;
        text-align: left;
        font-weight: bold;
        z-index: 1000;
        box-shadow: none;
    }
    .top-buttons {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    }

    .profile-btn, .logout-btn, .collab-btn {
        font-size: 18px;
        padding: 13px 23px;
        background-color: red;
        color: black;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.2s;
        width: 180px;
    }

    .profile-btn:hover,
    .logout-btn:hover,
     .collab-btn:hover{
        background-color: darkred;
        transform: scale(1.05);
    }

    form:hover {
        background-color: darkred;
        transform: scale(1.05);
    }

    form .arrow {
        font-size: 28px;
    }

    .center-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .projects-btn {
        font-size: 28px;
        padding: 20px 40px;
        background-color: #00ff00;
        color: black;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .projects-btn:hover {
        background-color: #39FF14;
        transform: scale(1.1);
    }

</style>

<div class="top-text">
    <h2>Home</h2>
</div>


<div class="top-buttons">
    <a href="/profile">
        <button type="button" class="profile-btn">
            👤 Profile
        </button>
    </a>

    <a href="/collaborators">
        <button type="button" class="collab-btn">
            👥 Collaborators
        </button>
    </a>

    <form method="post" action="/logout">
        <button type="submit" class="logout-btn">
            Logout ➔
        </button>
    </form>
</div>

<div class="center-button">
    <a href="/projects">
        <button type="button" class="projects-btn">
            📁 My Projects
        </button>
    </a>
</div>

</body>
</html>
