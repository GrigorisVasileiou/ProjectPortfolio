<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8">
    <title>Create Use Case</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            background-image: url('/images/project_details.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* DARK OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #020617;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar h2 {
            text-align: center;
            color: lawngreen;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #00ffcc;
            color: black;
        }

        /* MAIN */
        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .title {
            font-size: 28px;
            color: lawngreen;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* CARD */
        .card {
            background: #020617;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,255,204,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: orangered;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: limegreen;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.05);
            background: limegreen;
        }

        .label {
            color: limegreen;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

        .btn-delete {
        display: inline-block;
        padding: 10px 15px;
        background: red;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
        transition: 0.2s;
        cursor: pointer;
    }

    .btn-delete:hover {
        transform: scale(1.05);
        background: darkred;
    }

    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a th:href="@{/projects/{id}(id=${project.id})}">📁 Project Details</a>
</div>

<!-- MAIN -->
<div class="main">
    <div class="title">Create Use Case for Project: <span th:text="${project.name}"></span></div>

    <!-- LIST EXISTING USE CASES -->
    <div class="card">
        <h3>Existing Use Cases</h3>
        <div th:if="${#lists.isEmpty(usecases)}">No use cases yet.</div>
        <div th:each="uc : ${usecases}">
            <p>
                <span class="label">Name:</span> <span th:text="${uc.name}"></span><br/>
                <span class="label">Actors:</span> <span th:text="${uc.actors}"></span><br/>
                <span class="label">Preconditions:</span> <span th:text="${uc.preconditions}"></span><br/>
                <span class="label">Main Flow:</span> <span th:text="${uc.mainFlow}"></span><br/>
                <span class="label">Postconditions:</span> <span th:text="${uc.postconditions}"></span>
            </p>
            <form th:action="@{/usecases/delete}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${uc.id}" />
                <button class="btn-delete" type="submit">Delete</button>
            </form>
            <button class="btn"
                    th:attr="data-id=${uc.id}, data-name=${uc.name}, data-actors=${uc.actors}"
                    onclick="showUpdateForm(this)">Update</button>
            <hr/>
        </div>
    </div>

    <!-- CREATE FORM -->
    <div class="card">
        <h3>Create New Use Case</h3>
        <form th:action="@{/usecases/create}" method="post">
            <input type="hidden" name="projectId" th:value="${project.id}" />
            <label>Name: <input type="text" name="name" required/></label><br/>
            <label>Actors: <input type="text" name="actors" required/></label><br/>
            <label>Preconditions: <input type="text" name="preconditions"/></label><br/>
            <label>Main Flow: <input type="text" name="mainFlow"/></label><br/>
            <label>Postconditions: <input type="text" name="postconditions"/></label><br/>
            <button class="btn" type="submit">Create Use Case</button>
        </form>
    </div>

    <!-- UPDATE FORM (initially hidden) -->
    <div id="updateForm" class="card" style="display:none;">
        <h3>Update Use Case</h3>
        <form th:action="@{/usecases/update}" method="post">
            <input type="hidden" name="id" id="updateId"/>
            <label>Name: <input type="text" name="name" id="updateName"/></label><br/>
            <label>Actors: <input type="text" name="actors" id="updateActors"/></label><br/>
            <button class="btn" type="submit">Update Use Case</button>
        </form>
    </div>

</div>

<script>
    function showUpdateForm(button) {
        document.getElementById('updateForm').style.display = 'block';
        document.getElementById('updateId').value = button.dataset.id;
        document.getElementById('updateName').value = button.dataset.name;
        document.getElementById('updateActors').value = button.dataset.actors;
        window.scrollTo(0, document.getElementById('updateForm').offsetTop);
    }
</script>

</body>
</html>
