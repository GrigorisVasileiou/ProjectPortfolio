<!DOCTYPE html>
<body>
<style>
    body{
        background-image:url('/images/collab.png');
        background-size:cover;
        background-position: center 60%;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family:Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .top-text {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        transform: none;
        background: none;
        color: #00ff00;
        padding: 0;
        border-radius: 0;
        text-align: left;
        font-weight: bold;
        z-index: 1000;
        box-shadow: none;
    }

    .title {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #00ff00;
        font-size: 26px;
        font-weight: bold;
    }

    .back-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 18px;
        padding: 13px 23px;
        background-color: red;
        color: black;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .back-btn:hover {
        background-color: darkred;
        transform: scale(1.05);
    }
</style>
<div class="top-text">
    <h2>Here you can share a project with teammates.</h2>
</div>

<a href="/workspace">
    <button class="back-btn">⬅ Back</button>
</a>
</body>
