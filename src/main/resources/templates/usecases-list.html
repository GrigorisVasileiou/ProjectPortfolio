<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Use Cases</title>
    <style>
        body { font-family: Arial; background: #020617; color: white; margin: 0; padding: 20px; }
        .card { background: #111; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        .card h3 { color: limegreen; margin-top: 0; }
        .btn { background: limegreen; color: black; padding: 8px 12px; border-radius: 5px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<h1 th:text="'Use Cases for Project: ' + ${project.name}"></h1>

<div th:each="uc : ${usecases}" class="card">
    <h3 th:text="${uc.name}">Use Case Name</h3>
    <p><strong>Actors:</strong> <span th:text="${uc.actors}"></span></p>
    <p><strong>Preconditions:</strong> <span th:text="${uc.preconditions}"></span></p>
    <p><strong>Main Flow:</strong> <span th:text="${uc.mainFlow}"></span></p>
    <p><strong>Postconditions:</strong> <span th:text="${uc.postconditions}"></span></p>
</div>

<a th:href="@{/projects/{id}(id=${project.id})}" class="btn">Back to Project Details</a>

</body>
</html>
