<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style>
    body {
        margin: 0;
        font-family: Arial;
        color: white;

        background-image: url('/images/project_details.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    /* DARK OVERLAY */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: -1;
    }

    /* SIDEBAR */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 220px;
        height: 100%;
        background: #020617;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .sidebar h2 {
        text-align: center;
        color: lawngreen;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        padding: 15px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background: #00ffcc;
        color: black;
    }

    /* MAIN */
    .main {
        margin-left: 220px;
        padding: 30px;
    }

    .title {
        font-size: 28px;
        color: lawngreen;
        font-weight: bold;
        margin-bottom: 20px;
    }

    /* CARD */
    .card {
        background: #020617;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(0,255,204,0.1);
    }

    .card h3 {
        margin-top: 0;
        color: orangered;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        background: limegreen;
        color: black;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
        transition: 0.2s;
    }

    .btn:hover {
        transform: scale(1.05);
        background: limegreen;
    }

    .label {
        color: limegreen;
        font-weight: bold;
    }

</style>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a href="/projects">📁 My Projects</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="title">Project Details</div>

    <!-- PROJECT INFO -->
    <div class="card">
        <h3>Project Info</h3>
        <p><span class="label">Name:</span>
            <span class="value" th:text="${project.name}"></span>
        </p>

        <p><span class="label">Description:</span>
            <span class="value" th:text="${project.description}"></span>
        </p>
    </div>

    <!-- USE CASES -->
    <div class="card">
        <h3>Use Cases</h3>
        <a th:href="@{/usecases/create/{projectId}(projectId=${project.id})}" class="btn">🃏+ Add Use Case</a>
    </div>

    <!-- CRC CARDS -->
    <div class="card">
        <h3>CRC Cards</h3>
        <a th:href="@{/crc/create/{projectId}(projectId=${project.id})}" class="btn">🃏+ Add CRC Card</a>
    </div>

    <!-- USE CASES BUTTON -->
    <div class="card">
        <h3>Manage Use Cases</h3>
        <a th:href="@{/usecases/{projectId}(projectId=${project.id})}" class="btn">📑View Use Cases</a>
    </div>

    <!-- CRC CARDS BUTTON -->
    <div class="card">
        <h3>Manage CRC Cards</h3>
        <a th:href="@{/crc/{projectId}(projectId=${project.id})}" class="btn">🗂️View CRC Cards</a>
    </div>

    <!-- UML -->
    <div class="card">
        <h3>UML Visualization</h3>

        <a th:href="@{/uml(projectId=${project.id}, type='usecase')}" class="btn">
            📊 Scripts
        </a>
    </div>

</div>

</body>
</html>
