<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8">
    <title>Create CRC Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            background-image: url('/images/project_details.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #020617;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar h2 {
            text-align: center;
            color: lawngreen;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #00ffcc;
            color: black;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .title {
            font-size: 28px;
            color: lawngreen;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background: #020617;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,255,204,0.1);
            width: 500px;
        }

        .card h3 {
            margin-top: 0;
            color: orangered;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: limegreen;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-back {
            background: red;
            color: white;
        }

        .label {
            color: limegreen;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        .bullet-box {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            resize: vertical;
            background: #0f172a;
            color: white;
            line-height: 1.6;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .bullet-box:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(0,255,204,0.5);
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }

        textarea {
            resize: none;
            height: 60px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
    <a th:href="@{/projects/{id}(id=${project.id})}">📁 Project Details</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="title">Create CRC Card for: <span th:text="${project.name}"></span></div>

    <div class="card">
        <h3>Create New CRC Card</h3>

        <form th:action="@{/crc/create}" method="post">

            <input type="hidden" name="projectId" th:value="${project.id}">

            <label class="label">Class Name</label>
            <input type="text" name="className" required>

            <label class="label">Responsibilities</label>
            <textarea id="responsibilities" name="responsibilities" class="bullet-box"></textarea>

            <label class="label">Collaborators</label>
            <textarea id="collaborators" name="collaborators" class="bullet-box"></textarea>

            <label class="label">Use Cases</label>
            <div th:each="uc : ${usecases}" style="margin-bottom:10px;">

                <input type="checkbox"
                       name="useCaseIds"
                       th:value="${uc.id}"
                       th:id="'uc_create_' + ${uc.id}">

                <br>

                <label th:for="'uc_create_' + ${uc.id}"
                       th:text="${uc.name}"></label>

            </div>

            <button class="btn" type="submit">Create CRC Card</button>
        </form>

        <form th:action="@{/projects/{id}(id=${project.id})}" method="get">
            <button class="btn btn-back" type="submit">Back</button>
        </form>

    </div>

</div>

<script>
    function enableBulletBehavior(textareaId) {
        const textarea = document.getElementById(textareaId);

        textarea.addEventListener('focus', function () {
            if (textarea.value.trim() === '') {
                textarea.value = '• ';
            }
        });

        textarea.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();

                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                textarea.value = textarea.value.substring(0, start) + '\n• ' + textarea.value.substring(end);

                textarea.selectionStart = textarea.selectionEnd = start + 3;
            }
        });
    }

    enableBulletBehavior('responsibilities');
    enableBulletBehavior('collaborators');
</script>
</body>
</html>
