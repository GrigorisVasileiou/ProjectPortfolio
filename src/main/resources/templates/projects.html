<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style>
    body{
        background-image:url('/images/projects.png');
        background-size:cover;
        background-position: center 60%;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family:Arial;
        display: flex;
        height: 100vh;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: -1;
    }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 220px;
        height: 100%;
        background: #020617;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .sidebar h2 {
        text-align: center;
        color: lawngreen;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        padding: 15px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background: #00ffcc;
        color: black;
    }

    .main {
        margin-left: 220px;
        padding: 30px;
    }

    .title {
        font-size: 28px;
        margin-bottom: 20px;
        color: lawngreen;
        font-weight: bold;
    }

    .create-box {
        background: #020617;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 30px;
    }

    .create-box input {
        padding: 10px;
        margin-right: 10px;
        border-radius: 6px;
        border: none;
    }

    .create-box button {
        padding: 10px 15px;
        background: limegreen;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    .card {
        background: #020617;
        padding: 20px;
        border-radius: 15px;
        width: 250px;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(0,255,204,0.1);
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 20px rgba(0,255,150,0.5);
    }

    .card:active {
        transform: scale(1.04);
        box-shadow: 0 0 25px rgba(0,255,204,0.9);
    }

    .card h3 {
        margin: 0;
        color: limegreen;
    }

    .card p {
        font-size: 14px;
        color: #ccc;
    }

    .card a {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 12px;
        background: limegreen;
        color: black;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    .delete-btn {
        margin-top: 10px;
        background: red;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
    }
</style>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="/workspace">🏠 Home</a>
    <a href="/profile">👤 Profile</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="title">My Projects</div>

    <!-- CREATE PROJECT -->
    <div class="create-box">
        <form action="/projects/create" method="post">
            <input type="text" name="name" placeholder="Project Name" required />
            <input type="text" name="description" placeholder="Description" />
            <button type="submit">Create</button>
        </form>
    </div>

    <!-- PROJECT GRID -->
    <div class="grid">

        <div class="card" th:each="p : ${projects}">
            <h3 th:text="${p.name}"></h3>
            <p th:text="${p.description}"></p>

            <a th:href="@{'/projects/' + ${p.id}}">Open</a>

            <form action="/projects/delete" method="post">
                <input type="hidden" name="id" th:value="${p.id}" />
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </div>

    </div>
</div>
</body>
</html>
